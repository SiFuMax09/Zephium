[package]
name = "zephium-voice"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
# Feeds an audio file to the on-device recognizer, for automated checks.
file-probe = ["objc2-avf-audio/AVAudioFile", "objc2-foundation/NSURL"]

[[example]]
name = "transcribe"
required-features = ["file-probe"]

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSArray",
    "NSBundle",
    "NSEnumerator",
    "NSError",
    "NSLocale",
    "NSOperation",
    "NSSet",
    "NSString",
] }
objc2-speech = { version = "=0.3.2", default-features = false, features = [
    "std",
    "block2",
    "objc2-avf-audio",
    "SFSpeechRecognitionRequest",
    "SFSpeechRecognitionResult",
    "SFSpeechRecognitionTask",
    "SFSpeechRecognitionTaskHint",
    "SFSpeechRecognizer",
    "SFTranscription",
    "SFTranscriptionSegment",
] }
objc2-avf-audio = { version = "=0.3.2", default-features = false, features = [
    "std",
    "block2",
    "AVAudioApplication",
    "AVAudioBuffer",
    "AVAudioEngine",
    "AVAudioFormat",
    "AVAudioIONode",
    "AVAudioNode",
    "AVAudioTime",
    "AVAudioTypes",
] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
tempfile.workspace = true

[target.'cfg(target_os = "macos")'.dev-dependencies]
embed_plist = "=1.2.2"
